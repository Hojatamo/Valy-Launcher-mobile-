<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--blur:22px;--glow:.6;--hue:215;--spd:4s;--fs:18px;--ac:hsl(var(--hue) 78% 54%);--ac2:hsl(calc(var(--hue) + 55) 90% 68%);--tx:#1d2f52;--sub:#5d7096;--gl:rgba(232,240,251,.48);--gl2:rgba(224,234,250,.62);--bd:rgba(255,255,255,.5);--bg:linear-gradient(135deg,#cbd9ec,#d9e4f2 55%,#c4d5ea);--sh:rgba(50,85,150,.2)}

*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:500 14px 'Segoe UI',Tahoma,system-ui,sans-serif;color:var(--tx);background:var(--bg);transition:background .8s,color .5s;user-select:none}
img{-webkit-user-drag:none}

.orbs i:nth-child(2){width:300px;height:300px;right:-60px;top:20%;background:radial-gradient(circle at 30% 30%,#fff,var(--ac2) 45%,#ff7ad9);animation-delay:-6s}
.orbs i:nth-child(3){width:260px;height:260px;left:35%;bottom:-110px;background:radial-gradient(circle at 30% 30%,#fff,#5ee0ff 50%,var(--ac));animation-delay:-11s}

@keyframes fl{50%{transform:translate3d(60px,-50px,0) scale(1.12)}}
.noanim *{animation:none!important;transition:none!important}
.glass{background:var(--gl);backdrop-filter:blur(var(--blur)) saturate(1.6);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.6);border:1px solid var(--bd);border-radius:22px;box-shadow:0 10px 34px var(--sh),inset 0 1px 0 rgba(255,255,255,.4),0 0 calc(30px*var(--glow)) hsl(var(--hue) 100% 65%/calc(.25*var(--glow)));position:relative;overflow:clip}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.glass:hover::after{transform:translateX(120%);transition:transform .9s}
@keyframes rot{to{--ang:360deg}}
body.spin .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:calc(1.5px + var(--glow)*2px);background:conic-gradient(from var(--ang),transparent 0 52%,var(--ac) 74%,var(--ac2) 90%,#fff 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot var(--spd) linear infinite;pointer-events:none;z-index:5}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding:14px;gap:14px}

header{display:flex;align-items:center;gap:14px;padding:8px 14px;min-width:0;animation:dn .7s cubic-bezier(.2,.9,.3,1.2) both}

@keyframes dn{from{opacity:0;transform:translateY(-30px) scale(.97)}}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.96)}}

@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}

nav button:hover{transform:translateY(-2px)}nav button.on{color:#fff}nav button em{font-style:normal;display:flex;color:var(--ac);transition:transform .5s}nav button.on em{transform:rotate(360deg) scale(1.15);color:#fff}
.hb,.bms{display:flex;gap:8px;align-items:center;flex:none}
body.v .hb,body.v .bms{flex-direction:column}
.rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--gl2);color:var(--tx);cursor:pointer;display:grid;place-items:center;transition:transform .4s cubic-bezier(.3,1.5,.5,1),box-shadow .3s;position:relative;overflow:hidden;flex:none}

.bm{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--gl2);cursor:pointer;display:grid;place-items:center;padding:3px;transition:transform .35s cubic-bezier(.3,1.7,.5,1),box-shadow .3s;color:var(--ac)}
.bm img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.bm:hover{transform:translateY(-4px) scale(1.18) rotate(-6deg);box-shadow:0 0 18px var(--ac)}
#tip{position:fixed;z-index:95;pointer-events:none;width:220px;border-radius:18px;overflow:hidden;opacity:0;display:none;background:var(--gl2);backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:0 16px 40px var(--sh),0 0 26px hsl(var(--hue) 100% 65%/.5)}

@keyframes tipin{from{opacity:0;transform:translateY(-14px) scale(.7) rotate(-6deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
#tip .tc{height:100px;background:linear-gradient(135deg,var(--ac),var(--ac2)) center/cover}
#tip .tn{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700}#tip .tn img{width:24px;height:24px;object-fit:contain;border-radius:6px}#tip .tn svg{color:var(--ac)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bd);background:var(--gl2);color:var(--tx);font:inherit;font-weight:700;padding:10px 18px;border-radius:30px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .3s}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 8px 22px var(--sh),0 0 18px hsl(var(--hue) 100% 65%/.5)}.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}.btn.red{background:linear-gradient(135deg,#ff6b8a,#ff9a6b);color:#fff;border:0}
.btn .ic2{width:18px;height:18px;color:var(--ac)}.btn.pri .ic2,.btn.red .ic2{color:#fff}.rb .ic2{width:22px;height:22px;color:var(--ac)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
main{flex:1;min-height:0;min-width:0;display:flex}
.enter>*{animation:up .6s cubic-bezier(.2,.9,.3,1.1) both}

input[type=text],input[type=search],input[type=datetime-local],textarea,select{width:100%;border:1px solid var(--bd);background:var(--gl2);color:var(--tx);font:inherit;padding:10px 14px;border-radius:14px;outline:0;transition:box-shadow .3s,border .3s;user-select:text}

.row:hover{transform:translateX(6px);background:var(--gl2)}.row.on{background:linear-gradient(90deg,hsl(var(--hue) 100% 65%/.35),transparent);box-shadow:inset 3px 0 var(--ac)}

.cb{position:relative;display:inline-block;vertical-align:middle;width:30px;height:24px;color:var(--ac);flex:none}.cb svg{width:100%;height:100%;display:block}.cb i{position:absolute;right:-4px;top:-6px;font:800 10px sans-serif;background:var(--ac);color:#fff;border-radius:9px;padding:1px 5px;font-style:normal;min-width:15px;text-align:center}.cb.act{animation:pl 1.4s infinite}

.gbody{display:flex;gap:22px;padding:0 26px;margin-top:-70px;position:relative;z-index:2;flex:none}
.cover{width:150px;height:200px;border-radius:18px;flex:none;background:linear-gradient(135deg,var(--ac),var(--ac2)) center/cover;border:2px solid var(--bd);box-shadow:0 16px 36px var(--sh),0 0 30px hsl(var(--hue) 100% 65%/.45);display:grid;place-items:center;font-size:54px;color:#fff;font-weight:800;animation:up .7s both,flt 5s ease-in-out infinite}

.stats{display:flex;gap:12px;padding:0 26px 20px;flex-wrap:wrap;align-items:flex-start;flex:none}.stat{align-self:flex-start;padding:12px 18px;border-radius:16px;background:var(--gl2);border:1px solid var(--bd);animation:up .6s both}.stat b{display:block;font-size:20px;white-space:nowrap}

.star.on{color:#ffb300}.star.on svg{fill:url(#sg);filter:drop-shadow(0 0 6px #ffc83d);animation:sti 3.2s ease-in-out infinite}

.lib{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;padding:14px}

.r1{display:flex;align-items:center;gap:12px;min-width:0}

.cv,.pv{display:none}
